name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # localml pulls onnxruntime-node, whose install downloads a large GPU binary from nuget.org
      # that times out on CI. sheetedit is browser-only and never runs the Node binary, so skip it.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      # What sheetedit WRITES, checked against the official ECMA-376 schemas. It compares against
      # the input rather than demanding a perfect file, since real workbooks are not: only a
      # violation the original did not have is one this project introduced.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm run check:schema
      # A second reader, in another language, sharing no code with this one: does openpyxl
      # understand an authored workbook the way sheetedit meant it?
      - run: pip install --quiet openpyxl
      - run: npm run check:openpyxl
